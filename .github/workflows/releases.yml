name: Releases

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'dev'
  push:
    branches:
      - '**'

jobs:
  linux-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}
      
      - name: Set env vars
        id: envs
        run: |
          commit_sha=$(git rev-parse HEAD)
          date=$(date +%Y_%m_%d)
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          echo "date=$date" >> $GITHUB_OUTPUT
          echo "output_name=mrtrix3-linux-$commit_sha-$date" >> $GITHUB_OUTPUT

      - name: Install Eigen3
        run: |
          git clone https://gitlab.com/libeigen/eigen.git && cd eigen && git checkout 3.4.0
          cmake -B build && cmake --build build
          sudo cmake --install build

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.0'
          set-env: true

      - name: Run build
        run: |
          ./packaging/package-linux-tarball.sh .
          mv mrtrix.tar.gz ${{ steps.envs.outputs.output_name }}.tar.gz

      # For workflow_dispatch keep the existing artifact upload
      - name: Upload release artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.envs.outputs.output_name }}
          path: ${{ steps.envs.outputs.output_name }}.tar.gz

      # For push events, upload the built tarball to the existing GitHub Release with tag 'nightly-test'
      - name: Upload to 'nightly-test' release (push)
        if: github.event_name == 'push'
        run: |
          set -e
          # install gh if missing (ubuntu runners have gh preinstalled, but ensure it)
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gh
          fi

          # authenticate gh with the provided GITHUB_TOKEN
          echo "$GITHUB_TOKEN" | gh auth login --with-token

          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          tag="nightly-test"
          file="${{ steps.envs.outputs.output_name }}.tar.gz"

          # find the release by tag and delete existing assets
          release_id=$(gh api repos/$owner/$repo/releases/tags/$tag --jq .id)
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            echo "Found release id: $release_id"
            asset_ids=$(gh api repos/$owner/$repo/releases/$release_id/assets --jq '.[].id')
            for aid in $asset_ids; do
              echo "Deleting asset id $aid"
              gh api --method DELETE repos/$owner/$repo/releases/assets/$aid
            done
            # upload the artifact
            gh release upload $tag "$file" --clobber
          else
            echo "Release with tag $tag not found"
            exit 1
          fi

  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      - name: Set env vars
        id: envs
        run: |
          commit_sha=$(git rev-parse HEAD)
          date=$(date +%Y_%m_%d)
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          echo "date=$date" >> $GITHUB_OUTPUT
          echo "output_name=mrtrix3-macos-$commit_sha-$date" >> $GITHUB_OUTPUT

      - name: Install deps
        run: brew install numpy cmake qt eigen pkg-config fftw libpng ninja

      - name: Run build
        run: |
          cd ./packaging/macos
          ./build ${{ github.event.inputs.branch }}
          mv ./mrtrix3-macos-${{ github.event.inputs.branch }}.tar.xz ../../${{ steps.envs.outputs.output_name }}.tar.xz

      - name: Upload release artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.envs.outputs.output_name }}
          path: ${{ steps.envs.outputs.output_name }}.tar.xz

      - name: Upload to 'nightly-test' release (push)
        if: github.event_name == 'push'
        run: |
          set -e
          # install gh on macOS runner
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi

          echo "$GITHUB_TOKEN" | gh auth login --with-token

          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          tag="nightly-test"
          file="${{ steps.envs.outputs.output_name }}.tar.xz"

          release_id=$(gh api repos/$owner/$repo/releases/tags/$tag --jq .id)
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            echo "Found release id: $release_id"
            asset_ids=$(gh api repos/$owner/$repo/releases/$release_id/assets --jq '.[].id')
            for aid in $asset_ids; do
              echo "Deleting asset id $aid"
              gh api --method DELETE repos/$owner/$repo/releases/assets/$aid
            done
            gh release upload $tag "$file" --clobber
          else
            echo "Release with tag $tag not found"
            exit 1
          fi

  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    env:
      MINGW_PACKAGE_PREFIX: mingw-w64-ucrt-x86_64

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: |
            git
            python
            ${{env.MINGW_PACKAGE_PREFIX}}-bc
            ${{env.MINGW_PACKAGE_PREFIX}}-cmake
            ${{env.MINGW_PACKAGE_PREFIX}}-diffutils
            ${{env.MINGW_PACKAGE_PREFIX}}-eigen3
            ${{env.MINGW_PACKAGE_PREFIX}}-fftw
            ${{env.MINGW_PACKAGE_PREFIX}}-gcc
            ${{env.MINGW_PACKAGE_PREFIX}}-libtiff
            ${{env.MINGW_PACKAGE_PREFIX}}-ninja
            ${{env.MINGW_PACKAGE_PREFIX}}-pkg-config
            ${{env.MINGW_PACKAGE_PREFIX}}-qt6-base
            ${{env.MINGW_PACKAGE_PREFIX}}-qt6-svg
            ${{env.MINGW_PACKAGE_PREFIX}}-zlib

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}
      
      - name: Set env vars
        id: envs
        run: |
          commit_sha=$(git rev-parse HEAD)
          date=$(date +%Y_%m_%d)
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          echo "date=$date" >> $GITHUB_OUTPUT
          echo "output_name=mrtrix3-windows-$commit_sha-$date" >> $GITHUB_OUTPUT

      - name: Run build
        run: |
          cd packaging/mingw
          ./run.sh ${{ steps.envs.outputs.commit_sha }} daljit46
          mv mingw*.tar.zst ../../${{ steps.envs.outputs.output_name }}.tar.zst

      - name: Upload release artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.envs.outputs.output_name }}
          path: ${{ steps.envs.outputs.output_name }}.tar.zst

      - name: Upload to 'nightly-test' release
        if: github.event_name == 'push'
        run: |
          set -e
          # ensure gh is available on windows msys2 runner (msys2 images usually have gh installed)
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found. Please ensure gh is installed on the runner."
            exit 1
          fi

          echo "$GITHUB_TOKEN" | gh auth login --with-token

          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          tag="nightly-test"
          file="${{ steps.envs.outputs.output_name }}.tar.zst"

          release_id=$(gh api repos/$owner/$repo/releases/tags/$tag --jq .id)
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            echo "Found release id: $release_id"
            asset_ids=$(gh api repos/$owner/$repo/releases/$release_id/assets --jq '.[].id')
            for aid in $asset_ids; do
              echo "Deleting asset id $aid"
              gh api --method DELETE repos/$owner/$repo/releases/assets/$aid
            done
            gh release upload $tag "$file" --clobber
          else
            echo "Release with tag $tag not found"
            exit 1
          fi

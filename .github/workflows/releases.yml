name: Releases

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'dev'
  schedule:
    # 01:00 UTC every day – adjust as you like
    - cron: '*/10 * * * *'

permissions:
  contents: write  # needed for GH CLI to manage releases

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.vars.outputs.branch }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      changelog: ${{ steps.changes.outputs.changelog }}
    steps:
      - name: Select branch
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            # Nightly builds always from dev
            echo "branch=dev" >> "$GITHUB_OUTPUT"
          fi

      # Always check out dev for nightly comparison logic
      - name: Checkout dev for comparison
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: dev

      - name: Determine if there are new commits since last nightly
        id: changes
        run: |
          # Manual runs always build
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changelog=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nightly run: compare HEAD of dev vs nightly tag
          git fetch --tags origin

          if git rev-parse nightly >/dev/null 2>&1; then
            LOG="$(git log --oneline nightly..HEAD || true)"
          else
            # If nightly tag doesn't exist yet, treat all recent commits as "new"
            LOG="$(git log --oneline HEAD~50..HEAD || true)"
          fi

          if [ -z "$LOG" ]; then
            echo "No new commits since last nightly."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "changelog=" >> "$GITHUB_OUTPUT"
          else
            echo "Found new commits since last nightly."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "changelog<<EOF"
              echo "$LOG"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

  linux-release:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.branch }}
      
      - name: Set env vars
        id: envs
        run: |
          commit_sha=$(git rev-parse HEAD)
          date=$(date +%Y_%m_%d)
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          echo "date=$date" >> $GITHUB_OUTPUT
          echo "output_name=mrtrix3-linux-$commit_sha-$date" >> $GITHUB_OUTPUT

      - name: Install Eigen3
        run: |
          git clone https://gitlab.com/libeigen/eigen.git && cd eigen && git checkout 3.4.0
          cmake -B build && cmake --build build
          sudo cmake --install build

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.0'
          set-env: true

      - name: Run build
        run: |
          ./packaging/package-linux-tarball.sh .
          mv mrtrix.tar.gz ${{ steps.envs.outputs.output_name }}.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.envs.outputs.output_name }}
          path: ${{ steps.envs.outputs.output_name }}.tar.gz

  macos-release:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Set env vars
        id: envs
        run: |
          commit_sha=$(git rev-parse HEAD)
          date=$(date +%Y_%m_%d)
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          echo "date=$date" >> $GITHUB_OUTPUT
          echo "output_name=mrtrix3-macos-$commit_sha-$date" >> $GITHUB_OUTPUT

      - name: Install deps
        run: brew install numpy cmake qt pkg-config libpng ninja

      - name: Run build
        run: |
          cd ./packaging/macos
          ./build ${{ needs.prepare.outputs.branch }}
          mv ./mrtrix3-macos-${{ needs.prepare.outputs.branch }}.tar.xz ../../${{ steps.envs.outputs.output_name }}.tar.xz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.envs.outputs.output_name }}
          path: ${{ steps.envs.outputs.output_name }}.tar.xz

  windows-release:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    env:
      MINGW_PACKAGE_PREFIX: mingw-w64-ucrt-x86_64

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: |
            git
            python
            ${{env.MINGW_PACKAGE_PREFIX}}-bc
            ${{env.MINGW_PACKAGE_PREFIX}}-cmake
            ${{env.MINGW_PACKAGE_PREFIX}}-diffutils
            ${{env.MINGW_PACKAGE_PREFIX}}-eigen3
            ${{env.MINGW_PACKAGE_PREFIX}}-fftw
            ${{env.MINGW_PACKAGE_PREFIX}}-gcc
            ${{env.MINGW_PACKAGE_PREFIX}}-libtiff
            ${{env.MINGW_PACKAGE_PREFIX}}-ninja
            ${{env.MINGW_PACKAGE_PREFIX}}-pkg-config
            ${{env.MINGW_PACKAGE_PREFIX}}-qt6-base
            ${{env.MINGW_PACKAGE_PREFIX}}-qt6-svg
            ${{env.MINGW_PACKAGE_PREFIX}}-zlib

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.branch }}
      
      - name: Set env vars
        id: envs
        run: |
          commit_sha=$(git rev-parse HEAD)
          date=$(date +%Y_%m_%d)
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          echo "date=$date" >> $GITHUB_OUTPUT
          echo "output_name=mrtrix3-windows-$commit_sha-$date" >> $GITHUB_OUTPUT

      - name: Run build
        run: |
          cd packaging/mingw
          ./run.sh ${{ steps.envs.outputs.commit_sha }} mrtrix3
          mv mingw*.tar.zst ../../${{ steps.envs.outputs.output_name }}.tar.zst

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.envs.outputs.output_name }}
          path: ${{ steps.envs.outputs.output_name }}.tar.zst

  nightly-release:
    name: Create/update nightly release
    needs:
      - prepare
      - linux-release
      - macos-release
      - windows-release
    if: github.event_name == 'schedule' && needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub CLI auth
      CHANGELOG: ${{ needs.prepare.outputs.changelog }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded artifacts
        run: ls -R dist

      - name: Create or update nightly release
        run: |
          NOTES_FILE=notes.txt
          {
            echo "Nightly build for $(date -u +%Y-%m-%d)."
            echo
            if [ -n "$CHANGELOG" ]; then
              echo "Changes since last nightly:"
              echo
              echo "$CHANGELOG"
            else
              echo "No changelog available."
            fi
          } > "$NOTES_FILE"

          # Ensure the nightly release exists and update its notes
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --notes-file "$NOTES_FILE"
          else
            gh release create nightly --title "Nightly build" --notes-file "$NOTES_FILE"
          fi

          # Upload artifacts, overwriting old ones with the same names
          gh release upload nightly dist/** --clobber

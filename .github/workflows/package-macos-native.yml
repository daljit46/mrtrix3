name: package-macos-native

on:
  push:
  release:
    types: [created]

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Install gnu-tar
        run: brew install gnu-tar

      - name: Create alias for gnu-tar
        run: |
          tar --version
          mkdir -p /usr/local/bin
          sudo ln -s "$(which gtar)" /usr/local/bin/tar
          tar --version

      - name: fetch recipe
        run: git clone https://github.com/MRtrix3/macos-installer.git

      - name: build packages
        run: PATH=/usr/local/bin:$PATH ./build ${GITHUB_REF#refs/*/} 5.15.2
        working-directory: ./macos-installer

      - name: Upload package to GitHub Release
        uses: AButler/upload-release-assets@v2.0
        with:
          files: "macos-installer/mrtrix3-macos-*.tar.gz"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
